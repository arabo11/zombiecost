[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ghostbill"
version = "0.1.0"
description = "Find idle and forgotten AWS resources and estimate what they cost you every month."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "boto3>=1.34",
  "rich>=13.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "moto[ec2,cloudwatch]>=5.0",
]

[project.scripts]
ghostbill = "ghostbill.cli:main"

[tool.setuptools.packages.find]
include = ["ghostbill*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
