[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zombiecost"
version = "0.1.0"
description = "Find zombie AWS resources: idle and forgotten things that should be dead but still bill you every month."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "boto3>=1.34",
  "rich>=13.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "moto[ec2,cloudwatch]>=5.0",
]

[project.scripts]
zombiecost = "zombiecost.cli:main"

[tool.setuptools.packages.find]
include = ["zombiecost*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
