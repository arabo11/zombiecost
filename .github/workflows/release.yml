# Publishes to PyPI on a version tag using Trusted Publishing (OIDC).
# One-time setup on pypi.org: Your projects -> Publishing -> add a pending
# publisher for project "zombiecost", owner "arabo11", repo "zombiecost",
# workflow "release.yml", environment "pypi". No API token is stored anywhere.
name: release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build && python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
